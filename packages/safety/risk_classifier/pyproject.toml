[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safety-risk-classifier"
version = "0.1.0"
description = "Action risk classification subsystem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["safety_risk_classifier"]
