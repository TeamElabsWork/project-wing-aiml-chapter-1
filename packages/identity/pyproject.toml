[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "identity"
version = "0.1.0"
description = "Identity resolver: surface + external_id -> canonical user_id"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["identity"]
