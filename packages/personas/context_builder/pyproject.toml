[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personas-context-builder"
version = "0.1.0"
description = "Context assembly, token budgeting, and passthrough context builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["personas_context_builder"]
