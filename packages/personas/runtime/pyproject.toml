[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personas-runtime"
version = "0.1.0"
description = "Agent runtime interface, LLM provider abstraction, and EchoRuntime stub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["personas_runtime"]
