[project]
name = "personas-tools-core"
version = "0.1.0"
description = "Tool registry and tool scope enforcement interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["personas_tools_core"]
