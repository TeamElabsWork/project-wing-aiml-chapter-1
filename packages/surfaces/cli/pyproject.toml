[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surface-cli"
version = "0.1.0"
description = "CLI adapter providing interactive REPL against orchestrator pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "prompt-toolkit>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["surface_cli"]
