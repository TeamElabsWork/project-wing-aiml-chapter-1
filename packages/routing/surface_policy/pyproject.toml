[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routing-surface-policy"
version = "0.1.0"
description = "Surface policy rules and urgency evaluator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["routing_surface_policy"]
