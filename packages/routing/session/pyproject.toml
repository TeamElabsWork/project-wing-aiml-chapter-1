[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routing-session"
version = "0.2.0"
description = "Session state manager for multi-turn conversational context"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contracts",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
postgres = ["asyncpg>=0.29.0"]

[tool.hatch.build.targets.wheel]
packages = ["routing_session"]
