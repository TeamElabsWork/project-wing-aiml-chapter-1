[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routing-session"
version = "0.1.0"
description = "Session state manager for multi-turn conversational context"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["routing_session"]
