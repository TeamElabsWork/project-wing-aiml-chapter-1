[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-store"
version = "0.1.0"
description = "Memory storage interface, migrations, and in-memory repository"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["memory_store"]
