[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contracts"
version = "0.1.0"
description = "Shared Pydantic contracts for Surface-Aware Agent Orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["contracts"]
