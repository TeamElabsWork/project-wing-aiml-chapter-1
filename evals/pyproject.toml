[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evals"
version = "0.1.0"
description = "Routing evaluation harness and test cases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "pyyaml>=6.0",
    "routing-router",
    "personas-context-builder",
    "personas-registry",
]

[tool.hatch.build.targets.wheel]
packages = ["evals"]
