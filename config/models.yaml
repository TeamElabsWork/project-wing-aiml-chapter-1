# Model configuration slots for Router and Persona Runtime Execution
# Keep provider as "unset" until the team decides on an LLM vendor.
version: "1.0"

router:
  # Model slot for routing decisions (analyzes query, surface, state, and memory)
  provider: "unset"  # e.g., "anthropic", "openai", "google", "mock"
  model_name: "unset" # e.g., "claude-3-5-sonnet", "gpt-4o"
  temperature: 0.1
  max_tokens: 512
  timeout_seconds: 10
  fallback_strategy: "rule_based"

executor:
  # Model slot for persona execution (runs reasoning loops, generates replies, requests tools)
  provider: "unset"  # e.g., "anthropic", "openai", "google", "mock"
  model_name: "unset" # e.g., "claude-3-5-sonnet", "gpt-4o"
  temperature: 0.7
  max_tokens: 4096
  timeout_seconds: 60
  fallback_strategy: "retry"
