# Surface definitions, interaction profiles, and urgency policy rules
version: "1.0"

surfaces:
  cli:
    description: "Developer interactive command line REPL"
    interactive: true
    supports_markdown: true
    default_autonomy: "semi"
    urgency_keywords:
      - "urgent"
      - "asap"
      - "emergency"
      - "fix now"
    max_tokens_budget: 4096
    time_urgency_rules:
      after_hours:
        start: "18:00"
        end: "08:00"
        escalate_to: "high"
      weekends:
        escalate_to: "high"
    autonomy_restriction:
      on_urgent: "supervised"
    dynamic_budget:
      urgent: 2048
      after_hours: 1024
    metadata:
      channel: "terminal"
      allow_raw_formatting: true

  telegram:
    description: "Mobile messenger interface via Telegram bot"
    interactive: true
    supports_markdown: false
    default_autonomy: "supervised"
    urgency_keywords:
      - "urgent"
      - "sos"
      - "alert"
    max_tokens_budget: 1024
    time_urgency_rules:
      after_hours:
        start: "22:00"
        end: "07:00"
        escalate_to: "high"
      weekends:
        escalate_to: "high"
    autonomy_restriction:
      default: "supervised"
      on_urgent: "read_only"
    dynamic_budget:
      urgent: 512
      after_hours: 512
    metadata:
      channel: "mobile_chat"

  slack:
    description: "Enterprise collaboration channel and thread interface"
    interactive: true
    supports_markdown: true
    default_autonomy: "semi"
    urgency_keywords:
      - "p0"
      - "p1"
      - "incident"
      - "outage"
    max_tokens_budget: 2048
    time_urgency_rules:
      after_hours:
        start: "19:00"
        end: "08:00"
        escalate_to: "high"
      weekends:
        escalate_to: "high"
    autonomy_restriction:
      on_urgent: "supervised"
    dynamic_budget:
      urgent: 1024
    metadata:
      channel: "team_chat"

  web:
    description: "Browser web UI dashboard"
    interactive: true
    supports_markdown: true
    default_autonomy: "semi"
    urgency_keywords:
      - "urgent"
    max_tokens_budget: 4096
    autonomy_restriction:
      on_urgent: "supervised"
    dynamic_budget:
      urgent: 2048
    metadata:
      channel: "browser"
