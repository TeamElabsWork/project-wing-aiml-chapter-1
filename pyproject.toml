[project]
name = "surface-aware-orchestration"
version = "0.2.0"
description = "Surface-Aware Agent Orchestration scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "contracts",
    "gateway",
    "identity",
    "routing-surface-policy",
    "routing-router",
    "routing-session",
    "personas-registry",
    "personas-runtime",
    "personas-tools-core",
    "personas-tools-impl",
    "safety-risk-classifier",
    "safety-approval",
    "memory-store",
    "memory-writer",
    "memory-retriever",
    "transparency-routing-log",
    "surfaces-telegram-slack",
    "surface-cli",
    "orchestrator",
    "evals",
    "api",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12",
    "pre-commit>=3.7.0",
]

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/surfaces/telegram_slack",
    "packages/surfaces/cli",
    "packages/gateway",
    "packages/identity",
    "packages/routing/surface_policy",
    "packages/routing/router",
    "packages/routing/session",
    "packages/personas/registry",
    "packages/personas/runtime",
    "packages/personas/tools_core",
    "packages/personas/tools_impl",
    "packages/safety/risk_classifier",
    "packages/safety/approval",
    "packages/memory/store",
    "packages/memory/writer",
    "packages/memory/retriever",
    "packages/transparency/routing_log",
    "apps/orchestrator",
    "apps/api",
    "evals",
]

[tool.uv.sources]
contracts = { workspace = true }
gateway = { workspace = true }
identity = { workspace = true }
routing-surface-policy = { workspace = true }
routing-router = { workspace = true }
routing-session = { workspace = true }
personas-registry = { workspace = true }
personas-runtime = { workspace = true }
personas-tools-core = { workspace = true }
personas-tools-impl = { workspace = true }
safety-risk-classifier = { workspace = true }
safety-approval = { workspace = true }
memory-store = { workspace = true }
memory-writer = { workspace = true }
memory-retriever = { workspace = true }
transparency-routing-log = { workspace = true }
surfaces-telegram-slack = { workspace = true }
surface-cli = { workspace = true }
orchestrator = { workspace = true }
evals = { workspace = true }
api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [
    ".",
    "packages/contracts",
    "packages/surfaces/telegram_slack",
    "packages/surfaces/cli",
    "packages/gateway",
    "packages/identity",
    "packages/routing/surface_policy",
    "packages/routing/router",
    "packages/routing/session",
    "packages/personas/registry",
    "packages/personas/runtime",
    "packages/personas/tools_core",
    "packages/personas/tools_impl",
    "packages/safety/risk_classifier",
    "packages/safety/approval",
    "packages/memory/store",
    "packages/memory/writer",
    "packages/memory/retriever",
    "packages/transparency/routing_log",
    "apps/orchestrator",
    "apps/api",
    "evals",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = [
    "packages/contracts",
    "packages/surfaces/telegram_slack",
    "packages/surfaces/cli",
    "packages/gateway",
    "packages/identity",
    "packages/routing/surface_policy",
    "packages/routing/router",
    "packages/routing/session",
    "packages/personas/registry",
    "packages/personas/runtime",
    "packages/personas/tools_core",
    "packages/personas/tools_impl",
    "packages/safety/risk_classifier",
    "packages/safety/approval",
    "packages/memory/store",
    "packages/memory/writer",
    "packages/memory/retriever",
    "packages/transparency/routing_log",
    "apps/orchestrator",
    "apps/api",
    "evals",
]
